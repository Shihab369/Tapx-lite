services:

  # PostgreSQL 15 primary database
  # Data is persisted in a named volume so it survives container restarts.
  postgres:
    image: postgres:15-alpine
    container_name: tapx-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tapx
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Redis 7 included as a caching layer for future nonce lookups and balance reads.
  redis:
    image: redis:7
    container_name: tapx-redis
    restart: always
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # TapX Lite API starts only after both postgres and redis pass their health checks.
  # DB_HOST overrides the .env value so the app resolves postgres by container name
  # inside the Docker network rather than trying to reach localhost.
  app:
    image: tapx-lite:latest
    container_name: tapx-app
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      DB_HOST: postgres
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
